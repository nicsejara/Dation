name: Extract Data Hub evidence

on:
  push:
    branches: [diagnostics/data-hub-390-evidence]
    paths: [.github/workflows/data-hub-evidence.yml]

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read original main diagnostics
        uses: actions/download-artifact@v4
        with:
          name: dation-e2e-diagnostics
          run-id: 42052751164
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-diagnostics
      - name: List evidence paths
        run: find "$RUNNER_TEMP/original-diagnostics" -type f -printf '%P\n'
      - name: Save original Data Hub screenshots and summaries
        uses: actions/upload-artifact@v4
        with:
          name: original-main-data-hub-evidence
          path: |
            ${{ runner.temp }}/original-diagnostics/**/data-hub/**
            ${{ runner.temp }}/original-diagnostics/*.json
          if-no-files-found: error
          retention-days: 7
