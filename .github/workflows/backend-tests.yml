name: Backend and workspace tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        working-directory: backend
        run: |
          python -m compileall app main.py

      - name: Check frontend JavaScript syntax
        working-directory: backend
        run: |
          for file in app/static/js/api.js app/static/js/state.js app/static/js/ui.js app/static/js/app.js; do
            node --input-type=module --check < "$file"
          done
          for file in app/static/js/data-stage.js app/static/js/decision-stage.js app/static/js/dashboard-formatters.js app/static/js/dashboard-selectors.js app/static/js/dashboard-stage.js app/static/js/interpreter-stage.js; do
            node --check "$file"
          done

      - name: Run automated tests
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
          node tests/test_dashboard_selectors.js
