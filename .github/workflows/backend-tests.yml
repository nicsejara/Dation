name: Saga02 focused browser evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [9c645b9638863e251e3361cd8b9433bf76b3f76e, fc3f2e939f8809bab32688b0c48e76e668c835e6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve observer and select exact source
        run: |
          cp scripts/qa/saga02_browser_diagnostics.py /tmp/saga02_browser_diagnostics.py
          git checkout --detach '${{ matrix.source }}'
      - name: Install exact browser and runtime
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          python -m venv .browser-venv
          .browser-venv/bin/pip install --require-hashes -r requirements-browser.txt
          .browser-venv/bin/playwright install --with-deps chromium
      - name: Observe unchanged focal assertions
        working-directory: backend
        env:
          SOURCE_REF: ${{ matrix.source }}
          BROWSER_DIAGNOSTICS: ${{ runner.temp }}/browser-evidence
          DATION_RUNTIME_PYTHON: python
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          LLM_API_KEY: ''
        run: .browser-venv/bin/python /tmp/saga02_browser_diagnostics.py
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.source }}
          path: ${{ runner.temp }}/browser-evidence
          retention-days: 7
