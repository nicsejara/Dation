name: Backend and workspace tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip check
          python -m venv .audit-venv
          .audit-venv/bin/pip install --require-hashes -r requirements-dev.txt
          .audit-venv/bin/pip-audit --disable-pip --no-deps -r requirements.txt
          .audit-venv/bin/pip-audit --disable-pip --no-deps -r requirements-browser.txt
          python -m venv .browser-venv
          .browser-venv/bin/pip install --require-hashes -r requirements-browser.txt
          .browser-venv/bin/playwright install --with-deps chromium

      - name: Compile backend
        working-directory: backend
        run: |
          python -m compileall app main.py worker.py

      - name: Check frontend JavaScript syntax
        working-directory: backend
        run: |
          find app/static/js \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done

      - name: Run automated tests
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
          node tests/test_dashboard_selectors.js
          node --test tests/test_dispatch_selectors.mjs
          node --test tests/test_dispatch_upload_selectors.mjs
          node --test tests/test_decision_case.mjs
          node --test tests/test_navigation.mjs tests/test_lifecycle.mjs

      - name: Run browser regression tests with synthetic API data
        working-directory: backend
        run: .browser-venv/bin/python tests/browser/test_navigation.py

      - name: Verify schema, history, approvals and durable jobs on PostgreSQL 17
        working-directory: backend
        run: |
          docker run -d --name dation-ci-postgres -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f dation-ci-postgres' EXIT
          for attempt in {1..30}; do
            if docker exec dation-ci-postgres pg_isready -U postgres; then break; fi
            sleep 1
          done
          DATION_SQL_TEST_CONTAINER=dation-ci-postgres python -m unittest discover -s tests/integration -v
