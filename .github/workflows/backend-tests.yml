name: Saga02 focused browser evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [92656a1c8c94ae1181a18c47ddd681eaa313f92b, c1c33dc96bdfc239226c6b7b1121cb87972821c7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve observer and select exact source
        run: |
          cp scripts/qa/saga02_browser_diagnostics.py /tmp/saga02_browser_diagnostics.py
          git checkout --detach '${{ matrix.source }}'
      - name: Install exact browser and runtime
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.txt
          python -m venv .browser-venv
          .browser-venv/bin/pip install --require-hashes -r requirements-browser.txt
          .browser-venv/bin/playwright install --with-deps chromium
      - name: Read previous synthetic observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42227888412 -n 'browser-evidence-${{ matrix.source }}' -D /tmp/previous-observations
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/previous-observations/result.json').read_text())
          print('PREVIOUS_FOCAL_RESULT', d['tests'],len(d['failures']))
          for o in d['observations'][:8]:
              print(json.dumps({'test':o['test'],'browser':o['browser'],'observed':o['observed'],'before':{'width':o['before']['width'],'scroll':o['before']['scroll'],'html':o['before']['html']},'after':{'width':o['after_two_frames']['width'],'scroll':o['after_two_frames']['scroll']}}))
          PY2
      - name: Observe unchanged focal assertions
        working-directory: backend
        env:
          SOURCE_REF: ${{ matrix.source }}
          BROWSER_DIAGNOSTICS: ${{ runner.temp }}/browser-evidence
          DATION_RUNTIME_PYTHON: python
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          LLM_API_KEY: ''
        run: .browser-venv/bin/python /tmp/saga02_browser_diagnostics.py
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.source }}
          path: ${{ runner.temp }}/browser-evidence
          retention-days: 7
