name: Dation FAST gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      risk: ${{ steps.scan.outputs.risk }}
      requires_full: ${{ steps.scan.outputs.requires_full }}
      browser_tests: ${{ steps.scan.outputs.browser_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scan
        name: Classify actual diff (fail closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          python3 scripts/ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  fast:
    needs: impact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify impact classifier and fail-closed routing
        run: python3 -m unittest discover -s tests/operations -p test_rapid_impact.py -v
      - name: Static checks for changed JS / Python / CSS / JSON
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 scripts/ci/static_check.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install isolated browser fixture dependencies (R2 only)
        if: needs.impact.outputs.risk == 'R2'
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-browser.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Business-path browser smoke (R2 only)
        if: needs.impact.outputs.risk == 'R2'
        working-directory: backend/tests/browser
        env:
          DATION_BROWSER_TESTS: ${{ needs.impact.outputs.browser_tests }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          tests=json.loads(os.environ['DATION_BROWSER_TESTS'])
          if not tests:
              raise SystemExit('R2 requires at least one browser smoke')
          raise SystemExit(subprocess.call([sys.executable,'-m','unittest','-v',*tests]))
          PY
      - name: Summarize FAST result
        if: always()
        env:
          RISK: ${{ needs.impact.outputs.risk }}
        run: echo "FAST_GATE=$([[ '${{ job.status }}' == 'success' ]] && echo PASS || echo FAIL); RISK=$RISK; SOURCE_SHA=$GITHUB_SHA"

  full:
    needs: impact
    if: needs.impact.outputs.requires_full == 'true'
    uses: ./.github/workflows/backend-tests.yml
    permissions:
      contents: read

  gate:
    name: required-gate
    if: always()
    needs: [impact, fast, full]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce expected successful checks
        env:
          IMPACT: ${{ needs.impact.result }}
          FAST: ${{ needs.fast.result }}
          FULL: ${{ needs.full.result }}
          FULL_REQUIRED: ${{ needs.impact.outputs.requires_full }}
          RISK: ${{ needs.impact.outputs.risk }}
        run: |
          echo "GATE: IMPACT=$IMPACT FAST=$FAST FULL=$FULL FULL_REQUIRED=$FULL_REQUIRED RISK=$RISK SHA=$GITHUB_SHA"
          test "$IMPACT" = success
          test "$FAST" = success
          if [ "$FULL_REQUIRED" = true ]; then test "$FULL" = success; else test "$FULL" = skipped; fi
          echo "DATION_GATE=PASS RISK=$RISK SOURCE_SHA=$GITHUB_SHA"
