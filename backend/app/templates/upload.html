<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dation · Logistics DDA</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #16181d; }
    main { max-width: 760px; margin: 64px auto; padding: 0 20px; }
    .card { background: white; border: 1px solid #e4e7ec; border-radius: 18px; padding: 30px; box-shadow: 0 8px 30px rgba(16,24,40,.06); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #667085; line-height: 1.5; }
    .drop { margin-top: 28px; border: 2px dashed #cfd4dc; border-radius: 14px; padding: 28px; text-align: center; }
    input[type=file] { width: 100%; }
    button { margin-top: 22px; width: 100%; border: 0; border-radius: 10px; padding: 14px 18px; font-size: 15px; font-weight: 650; cursor: pointer; background: #111827; color: white; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #result { margin-top: 22px; padding: 16px; border-radius: 10px; background: #f2f4f7; white-space: pre-wrap; display: none; overflow-wrap: anywhere; }
    .meta { margin-top: 18px; font-size: 13px; color: #667085; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Logistics Decision Asset</h1>
    <p>Primera etapa de ingesta de Dation. El archivo se valida contra el schema <strong>logistics_v0.1</strong> antes de almacenarse.</p>

    <form id="upload-form">
      <div class="drop">
        <input id="file" name="file" type="file" accept=".csv,text/csv" required>
      </div>
      <button id="submit" type="submit">Validar y cargar dataset</button>
    </form>

    <div id="result"></div>
    <div class="meta">Máximo actual: 10 MB · CSV UTF-8 · 14 columnas requeridas.</div>
  </div>
</main>

<script>
const form = document.getElementById("upload-form");
const button = document.getElementById("submit");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const file = document.getElementById("file").files[0];
  if (!file) return;

  button.disabled = true;
  button.textContent = "Procesando...";
  result.style.display = "block";
  result.textContent = "Validando dataset...";

  const body = new FormData();
  body.append("file", file);

  try {
    const response = await fetch("/api/datasets/upload", {
      method: "POST",
      body
    });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || JSON.stringify(data));
    }

    if (data.duplicate) {
      result.textContent =
        "El archivo ya fue cargado previamente.\n\n" +
        JSON.stringify(data, null, 2);
    } else {
      result.textContent =
        "Dataset cargado correctamente.\n\n" +
        JSON.stringify(data, null, 2);
    }
  } catch (error) {
    result.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Validar y cargar dataset";
  }
});
</script>
</body>
</html>
